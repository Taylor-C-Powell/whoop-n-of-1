name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Alignment rules
        run: python -m pytest -q
      - name: Re-run the analysis
        run: python analyze.py
      - name: Results must regenerate exactly
        run: git diff --exit-code -- results.md results.json
